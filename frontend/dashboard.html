<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OneSpace - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      "colors": {
        "surface-variant": "#e5e2e1", "on-primary-container": "#dad7ff", "secondary-container": "#d0e1fb",
        "surface": "#fcf9f8", "secondary": "#505f76", "inverse-surface": "#313030",
        "secondary-fixed-dim": "#b7c8e1", "background": "#fcf9f8", "on-tertiary": "#ffffff",
        "inverse-on-surface": "#f3f0ef", "on-surface": "#1c1b1b", "tertiary-fixed": "#ffdbcc",
        "on-error": "#ffffff", "surface-container-low": "#f6f3f2", "primary": "#3525cd",
        "secondary-fixed": "#d3e4fe", "error-container": "#ffdad6", "inverse-primary": "#c3c0ff",
        "on-error-container": "#93000a", "surface-bright": "#fcf9f8", "tertiary-container": "#a44100",
        "on-tertiary-fixed": "#351000", "surface-container-lowest": "#ffffff",
        "on-secondary-container": "#54647a", "primary-fixed-dim": "#c3c0ff",
        "on-primary-fixed": "#0f0069", "tertiary-fixed-dim": "#ffb695",
        "on-surface-variant": "#464555", "primary-fixed": "#e2dfff", "surface-tint": "#4d44e3",
        "on-tertiary-container": "#ffd2be", "on-secondary-fixed": "#0b1c30",
        "surface-dim": "#dcd9d9", "surface-container-highest": "#e5e2e1",
        "on-background": "#1c1b1b", "surface-container-high": "#ebe7e7",
        "surface-container": "#f0edec", "outline": "#777587", "tertiary": "#7e3000",
        "on-secondary-fixed-variant": "#38485d", "on-tertiary-fixed-variant": "#7b2f00",
        "error": "#ba1a1a", "on-secondary": "#ffffff", "outline-variant": "#c7c4d8",
        "on-primary": "#ffffff", "primary-container": "#4f46e5",
        "on-primary-fixed-variant": "#3323cc"
      },
      "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
      "spacing": { "lg": "24px", "xl": "32px", "base-unit": "4px", "xs": "4px", "gutter": "24px", "margin": "24px", "sm": "8px", "md": "16px" },
      "fontFamily": { "display-lg": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "label-caps": ["Inter"] },
      "fontSize": {
        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
        "headline-sm": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
      }
    }
  }
}
</script>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/dashboard.css" rel="stylesheet"/>
<style>.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex antialiased">

<!-- Main Content -->
<main class="flex-1 md:ml-[280px] p-lg max-w-[1440px] mx-auto w-full min-h-screen flex flex-col gap-gutter">
  <!-- Breadcrumb & Header -->
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-md pt-md">
    <div>
      <nav class="flex items-center gap-sm font-label-sm text-label-sm text-on-surface-variant mb-xs">
        <a class="hover:text-primary transition-colors" href="workspaces.html">All Workspaces</a>
        <span class="material-symbols-outlined text-sm">chevron_right</span>
        <span class="text-on-surface" id="workspaceName">Dashboard</span>
      </nav>
      <h1 class="font-display-lg text-display-lg text-on-surface" id="workspaceTitle">Dashboard</h1>
      <p class="font-body-md text-body-md text-on-surface-variant mt-1" id="workspaceDescription"></p>
    </div>
  </header>

  <!-- Summary Stats Row -->
  <section id="summaryCards" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-gutter"></section>

  <!-- Two Column Layout -->
  <section class="grid grid-cols-1 lg:grid-cols-12 gap-gutter flex-1 items-start">
    <!-- Left Column -->
    <div class="lg:col-span-8 flex flex-col gap-gutter">
      <!-- Recent Tasks -->
      <div class="bg-surface rounded-xl border border-outline-variant p-lg flex flex-col gap-md">
        <div class="flex items-center justify-between border-b border-outline-variant pb-sm">
          <h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-sm">
            <span class="material-symbols-outlined text-primary">event_upcoming</span> Recent Tasks
          </h2>
          <a href="#" class="text-primary font-label-sm text-label-sm hover:underline" data-nav="tasks">View All</a>
        </div>
        <div id="recentTasksList" class="flex flex-col gap-sm"></div>
      </div>

      <!-- Recent Notes -->
      <div class="bg-surface rounded-xl border border-outline-variant p-lg flex flex-col gap-md">
        <div class="flex items-center justify-between border-b border-outline-variant pb-sm">
          <h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-sm">
            <span class="material-symbols-outlined text-tertiary">description</span> Recent Notes
          </h2>
          <a href="#" class="text-primary font-label-sm text-label-sm hover:underline" data-nav="notes">View All</a>
        </div>
        <div id="recentNotesList" class="flex flex-col gap-sm"></div>
      </div>

      <!-- Recent Resources -->
      <div class="bg-surface rounded-xl border border-outline-variant p-lg flex flex-col gap-md">
        <div class="flex items-center justify-between border-b border-outline-variant pb-sm">
          <h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-sm">
            <span class="material-symbols-outlined text-secondary">bookmark</span> Recent Resources
          </h2>
          <a href="#" class="text-primary font-label-sm text-label-sm hover:underline" data-nav="resources">View All</a>
        </div>
        <div id="recentResourcesList" class="flex flex-col gap-sm"></div>
      </div>

      <!-- Recent Files -->
      <div class="bg-surface rounded-xl border border-outline-variant p-lg flex flex-col gap-md">
        <div class="flex items-center justify-between border-b border-outline-variant pb-sm">
          <h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-sm">
            <span class="material-symbols-outlined" style="color: #4f46e5;">folder</span> Recent Files
          </h2>
          <a href="#" class="text-primary font-label-sm text-label-sm hover:underline" data-nav="files">View All</a>
        </div>
        <div id="recentFilesList" class="flex flex-col gap-sm"></div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="lg:col-span-4 flex flex-col gap-gutter">
      <!-- Recent Activity -->
      <div class="bg-surface rounded-xl border border-outline-variant p-lg flex flex-col gap-md">
        <h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-outline-variant pb-sm">Recent Activity</h2>
        <div id="recentActivityList" class="relative pl-6 flex flex-col gap-lg before:absolute before:left-[11px] before:top-2 before:bottom-2 before:w-[2px] before:bg-outline-variant"></div>
      </div>
    </div>
  </section>
</main>

<!-- Toast Container -->
<div id="toast-container" class="fixed bottom-20 md:bottom-8 right-4 z-[200] flex flex-col gap-sm"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
