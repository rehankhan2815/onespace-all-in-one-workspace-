<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - OneSpace</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e5e2e1",
                        "on-primary-container": "#dad7ff",
                        "secondary-container": "#d0e1fb",
                        "surface": "#fcf9f8",
                        "secondary": "#505f76",
                        "inverse-surface": "#313030",
                        "secondary-fixed-dim": "#b7c8e1",
                        "background": "#fcf9f8",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f3f0ef",
                        "on-surface": "#1c1b1b",
                        "tertiary-fixed": "#ffdbcc",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f6f3f2",
                        "primary": "#3525cd",
                        "secondary-fixed": "#d3e4fe",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#c3c0ff",
                        "on-error-container": "#93000a",
                        "surface-bright": "#fcf9f8",
                        "tertiary-container": "#a44100",
                        "on-tertiary-fixed": "#351000",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#54647a",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-primary-fixed": "#0f0069",
                        "tertiary-fixed-dim": "#ffb695",
                        "on-surface-variant": "#464555",
                        "primary-fixed": "#e2dfff",
                        "surface-tint": "#4d44e3",
                        "on-tertiary-container": "#ffd2be",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-dim": "#dcd9d9",
                        "surface-container-highest": "#e5e2e1",
                        "on-background": "#1c1b1b",
                        "surface-container-high": "#ebe7e7",
                        "surface-container": "#f0edec",
                        "outline": "#777587",
                        "tertiary": "#7e3000",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c7c4d8",
                        "on-primary": "#ffffff",
                        "primary-container": "#4f46e5",
                        "on-primary-fixed-variant": "#3323cc"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "base-unit": "4px",
                        "xs": "4px",
                        "gutter": "24px",
                        "margin": "24px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
                        "headline-sm": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background dark:bg-inverse-surface text-on-background dark:text-inverse-on-surface min-h-screen flex items-center justify-center p-md antialiased transition-colors duration-300">
<div class="w-full max-w-md">
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary dark:text-inverse-primary mb-sm">OneSpace</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant dark:text-surface-variant">Create your account</p>
</div>
<div class="bg-surface dark:bg-surface-container-low border border-outline-variant dark:border-outline rounded-xl p-xl shadow-[0px_4px_12px_rgba(0,0,0,0.05)] dark:shadow-none">
<form action="#" class="space-y-md" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface dark:text-inverse-on-surface mb-xs" for="fullName">Full Name</label>
<input class="w-full h-11 px-sm rounded-lg bg-background dark:bg-inverse-surface border border-outline-variant dark:border-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface dark:text-inverse-on-surface placeholder:text-outline transition-all" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface dark:text-inverse-on-surface mb-xs" for="email">Email Address</label>
<input class="w-full h-11 px-sm rounded-lg bg-background dark:bg-inverse-surface border border-outline-variant dark:border-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface dark:text-inverse-on-surface placeholder:text-outline transition-all" id="email" name="email" placeholder="jane.doe@university.edu" required="" type="email"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface dark:text-inverse-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<input class="w-full h-11 px-sm rounded-lg bg-background dark:bg-inverse-surface border border-outline-variant dark:border-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface dark:text-inverse-on-surface placeholder:text-outline transition-all pr-10" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-sm text-outline hover:text-on-surface dark:hover:text-inverse-on-surface focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<div class="mt-sm">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant dark:text-surface-variant">Password strength:</span>
<span class="font-label-sm text-label-sm text-tertiary">Medium</span>
</div>
<div class="flex gap-1 h-1.5 w-full">
<div class="flex-1 bg-tertiary rounded-full"></div>
<div class="flex-1 bg-tertiary rounded-full"></div>
<div class="flex-1 bg-surface-container-high dark:bg-surface-variant rounded-full"></div>
<div class="flex-1 bg-surface-container-high dark:bg-surface-variant rounded-full"></div>
</div>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-error dark:text-error mb-xs" for="confirmPassword">Confirm Password</label>
<div class="relative">
<input aria-describedby="password-error" aria-invalid="true" class="w-full h-11 px-sm rounded-lg bg-error-container/20 dark:bg-error-container/10 border-2 border-error focus:outline-none focus:ring-0 font-body-md text-body-md text-on-surface dark:text-inverse-on-surface transition-all pr-10" id="confirmPassword" name="confirmPassword" required="" type="password" value="wrongpassword"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-sm pointer-events-none text-error">
<span class="material-symbols-outlined" data-icon="error">error</span>
</div>
</div>
<p class="mt-xs font-label-sm text-label-sm text-error" id="password-error">Passwords do not match.</p>
</div>
<div class="flex items-start gap-sm pt-xs pb-sm">
<div class="flex items-center h-5">
<input class="h-4 w-4 rounded border-outline-variant dark:border-outline text-primary focus:ring-primary focus:ring-2 bg-background dark:bg-inverse-surface cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant" for="terms">
                        I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>.
                    </label>
</div>
<button class="w-full h-11 bg-primary hover:bg-primary-fixed-dim text-on-primary font-label-caps text-label-caps rounded-lg transition-colors duration-200 flex items-center justify-center gap-xs" type="submit">
                    CREATE ACCOUNT
                </button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant dark:text-surface-variant">
                    Already have an account? <a class="text-primary hover:underline font-medium" href="#">Log in</a>
</p>
</div>
</div>
</div>
<button aria-label="Toggle Dark Mode" class="fixed bottom-4 right-4 p-2 rounded-full bg-surface-container-high dark:bg-surface-variant text-on-surface dark:text-inverse-on-surface shadow-lg hover:opacity-80 transition-opacity" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-symbols-outlined dark:hidden" data-icon="dark_mode">dark_mode</span>
<span class="material-symbols-outlined hidden dark:block" data-icon="light_mode">light_mode</span>
</button>
</body></html>
