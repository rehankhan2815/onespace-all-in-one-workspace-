<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OneSpace - Workspaces</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      "colors": {
        "surface-variant": "#e5e2e1", "on-primary-container": "#dad7ff", "secondary-container": "#d0e1fb",
        "surface": "#fcf9f8", "secondary": "#505f76", "inverse-surface": "#313030",
        "secondary-fixed-dim": "#b7c8e1", "background": "#fcf9f8", "on-tertiary": "#ffffff",
        "inverse-on-surface": "#f3f0ef", "on-surface": "#1c1b1b", "tertiary-fixed": "#ffdbcc",
        "on-error": "#ffffff", "surface-container-low": "#f6f3f2", "primary": "#3525cd",
        "secondary-fixed": "#d3e4fe", "error-container": "#ffdad6", "inverse-primary": "#c3c0ff",
        "on-error-container": "#93000a", "surface-bright": "#fcf9f8", "tertiary-container": "#a44100",
        "on-tertiary-fixed": "#351000", "surface-container-lowest": "#ffffff",
        "on-secondary-container": "#54647a", "primary-fixed-dim": "#c3c0ff",
        "on-primary-fixed": "#0f0069", "tertiary-fixed-dim": "#ffb695",
        "on-surface-variant": "#464555", "primary-fixed": "#e2dfff", "surface-tint": "#4d44e3",
        "on-tertiary-container": "#ffd2be", "on-secondary-fixed": "#0b1c30",
        "surface-dim": "#dcd9d9", "surface-container-highest": "#e5e2e1",
        "on-background": "#1c1b1b", "surface-container-high": "#ebe7e7",
        "surface-container": "#f0edec", "outline": "#777587", "tertiary": "#7e3000",
        "on-secondary-fixed-variant": "#38485d", "on-tertiary-fixed-variant": "#7b2f00",
        "error": "#ba1a1a", "on-secondary": "#ffffff", "outline-variant": "#c7c4d8",
        "on-primary": "#ffffff", "primary-container": "#4f46e5",
        "on-primary-fixed-variant": "#3323cc"
      },
      "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
      "spacing": { "lg": "24px", "xl": "32px", "base-unit": "4px", "xs": "4px", "gutter": "24px", "margin": "24px", "sm": "8px", "md": "16px" },
      "fontFamily": { "display-lg": ["Inter"], "label-sm": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"], "body-md": ["Inter"], "label-caps": ["Inter"] },
      "fontSize": {
        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "500" }],
        "headline-sm": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }]
      }
    }
  }
}
</script>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/dashboard.css" rel="stylesheet"/>
<style>.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex antialiased">

<!-- Main Content -->
<main class="flex-1 md:ml-[280px] p-lg max-w-7xl mx-auto w-full flex flex-col gap-xl min-h-screen">
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-md">
    <h1 class="font-display-lg text-display-lg text-on-surface dark:text-inverse-on-surface">Your Workspaces</h1>
    <button class="h-11 px-md bg-primary text-on-primary rounded-DEFAULT font-label-sm text-label-sm hover:bg-primary-fixed-variant transition-colors flex items-center gap-sm shrink-0" type="button" data-bs-toggle="modal" data-bs-target="#createWorkspaceModal">
      <span class="material-symbols-outlined text-[18px]">add</span> New Workspace
    </button>
  </div>
  <div id="workspaceList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter"></div>
  <div id="emptyState" class="d-none">
    <div class="bg-surface-variant/30 dark:bg-surface-container-highest/30 rounded-lg border border-dashed border-outline-variant p-xl flex flex-col items-center justify-center gap-md text-center min-h-[300px]">
      <div class="h-16 w-16 bg-surface dark:bg-surface-container-low rounded-full flex items-center justify-center shadow-sm">
        <span class="material-symbols-outlined text-primary text-[32px]">add_box</span>
      </div>
      <div>
        <h3 class="font-headline-sm text-headline-sm text-on-surface dark:text-inverse-on-surface">No workspaces yet</h3>
        <p class="font-body-md text-body-md text-on-surface-variant mt-xs max-w-[320px] mx-auto">Create a workspace to start organizing your tasks, notes, and files.</p>
      </div>
      <button class="mt-sm h-11 px-md bg-primary text-on-primary rounded-DEFAULT font-label-sm text-label-sm hover:bg-primary-fixed-variant transition-colors flex items-center gap-sm" type="button" data-bs-toggle="modal" data-bs-target="#createWorkspaceModal">
        <span class="material-symbols-outlined text-[18px]">add</span> Create Workspace
      </button>
    </div>
  </div>
</main>

<!-- Create Workspace Modal (Bootstrap compatible) -->
<div class="modal fade" id="createWorkspaceModal" tabindex="-1" aria-labelledby="createWorkspaceModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content bg-surface border border-outline-variant rounded-xl shadow-xl">
      <div class="modal-header border-b border-outline-variant px-lg py-md">
        <h5 class="modal-title font-headline-md text-headline-md text-on-surface" id="createWorkspaceModalLabel">Create Workspace</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="createWorkspaceForm" class="needs-validation" novalidate>
        <div class="modal-body px-lg py-lg space-y-lg">
          <div class="space-y-1">
            <label for="workspaceName" class="font-label-sm text-label-sm text-on-surface-variant block">Workspace Name <span class="text-error">*</span></label>
            <input type="text" class="w-full bg-surface border border-outline-variant rounded-lg px-md py-2 font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="workspaceName" name="name" placeholder="e.g., Fall 2024 Research" required maxlength="200"/>
            <div class="invalid-feedback">Name is required.</div>
          </div>
          <div class="space-y-1">
            <label for="workspaceDescription" class="font-label-sm text-label-sm text-on-surface-variant block">Description</label>
            <textarea class="w-full bg-surface border border-outline-variant rounded-lg px-md py-2 font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline resize-none" id="workspaceDescription" name="description" rows="3" placeholder="Brief description (optional)" maxlength="500"></textarea>
          </div>
        </div>
        <div class="modal-footer border-t border-outline-variant px-lg py-md flex justify-end gap-md">
          <button type="button" class="px-md py-2 rounded-lg font-headline-sm text-label-sm border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors h-[44px]" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="px-md py-2 rounded-lg font-headline-sm text-label-sm bg-primary text-on-primary hover:bg-primary-container transition-colors h-[44px] flex items-center gap-sm" id="createWorkspaceSubmit">
            <span class="btn-text">Create</span>
            <span class="btn-loading d-none"><span class="w-4 h-4 border-2 border-on-primary/30 border-t-on-primary rounded-full animate-spin inline-block"></span> Creating...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container" class="fixed bottom-20 md:bottom-8 right-4 z-[200] flex flex-col gap-sm"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/workspaces.js"></script>
</body>
</html>
