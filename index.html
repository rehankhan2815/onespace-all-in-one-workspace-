<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Python In-Browser Compiler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    pre, code, textarea { font-family: 'JetBrains Mono', monospace; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- Top Navbar -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20">
        <span class="material-symbols-outlined text-[20px]">terminal</span>
      </div>
      <div>
        <h1 class="text-base font-semibold leading-tight text-white">OneSpace Python Compiler</h1>
        <p class="text-xs text-slate-400">Powered by Pyodide WebAssembly &bull; Client-side Execution</p>
      </div>
    </div>

    <!-- Actions & Toolbar -->
    <div class="flex items-center gap-3">
      <!-- Saved Programs dropdown -->
      <select id="savedSelect" class="bg-slate-800 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 outline-none focus:border-indigo-500 transition">
        <option value="">Select saved program...</option>
      </select>

      <button id="saveBtn" class="flex items-center gap-1.5 px-3 py-2 border border-slate-700 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-xs font-medium text-slate-200 hover:text-white transition">
        <span class="material-symbols-outlined text-[16px]">save</span> Save
      </button>

      <button id="deleteBtn" class="flex items-center gap-1.5 px-3 py-2 border border-rose-900/40 rounded-lg bg-rose-950/20 hover:bg-rose-950/50 text-xs font-medium text-rose-300 transition disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <span class="material-symbols-outlined text-[16px]">delete</span> Delete
      </button>

      <button id="clearBtn" class="flex items-center gap-1.5 px-3 py-2 border border-slate-700 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-xs font-medium text-slate-300 hover:text-white transition">
        <span class="material-symbols-outlined text-[16px]">clear_all</span> Clear Output
      </button>

      <button id="runBtn" class="flex items-center gap-2 px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-lg shadow-indigo-600/30 transition">
        <span id="runBtnIcon" class="material-symbols-outlined text-[18px]">play_arrow</span>
        <span id="runBtnText">Run (Ctrl+Enter)</span>
      </button>
    </div>
  </header>

  <!-- Main Grid Workspace -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-[1800px] w-full mx-auto">
    <!-- Code Editor Section -->
    <div class="flex flex-col bg-slate-950 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="px-4 py-2.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs font-medium text-slate-300">
          <span class="material-symbols-outlined text-indigo-400 text-[18px]">code</span>
          <span>main.py</span>
        </div>
        <span id="saveStatus" class="text-[11px] text-slate-500">Unsaved snippet</span>
      </div>
      <textarea id="codeEditor" spellcheck="false" class="flex-1 w-full p-4 bg-transparent text-slate-100 text-sm leading-relaxed resize-none outline-none selection:bg-indigo-700" placeholder="# Write your Python code here..."></textarea>
    </div>

    <!-- Output Terminal Section -->
    <div class="flex flex-col bg-slate-950 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
      <div class="px-4 py-2.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs font-medium text-slate-300">
          <span class="material-symbols-outlined text-emerald-400 text-[18px]">terminal</span>
          <span>Terminal Output</span>
        </div>
        <span id="runtimeStatus" class="text-[11px] text-slate-400">Ready</span>
      </div>
      <pre id="outputPanel" class="flex-1 w-full p-4 text-xs font-mono leading-relaxed overflow-auto whitespace-pre-wrap text-slate-300 select-text">Click 'Run' or press Ctrl+Enter to execute Python code.</pre>
    </div>
  </main>

  <!-- Pyodide CDN -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

  <script>
    const DEFAULT_CODE = `# Welcome to the OneSpace Python Compiler!
import sys
import math

def greet(name):
    return f"Hello, {name}!"

print(greet("OneSpace User"))
print(f"Python Version: {sys.version.split()[0]}")
print(f"Pi calculated: {math.pi:.5f}")
`;

    // DOM Elements
    const codeEditor = document.getElementById("codeEditor");
    const outputPanel = document.getElementById("outputPanel");
    const runBtn = document.getElementById("runBtn");
    const runBtnText = document.getElementById("runBtnText");
    const runBtnIcon = document.getElementById("runBtnIcon");
    const runtimeStatus = document.getElementById("runtimeStatus");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const deleteBtn = document.getElementById("deleteBtn");
    const savedSelect = document.getElementById("savedSelect");
    const saveStatus = document.getElementById("saveStatus");

    // State
    let pyodideInstance = null;
    let pyodideLoading = false;
    let snippets = JSON.parse(localStorage.getItem("standalone_compiler_snippets") || "[]");
    let currentSnippetId = null;

    // Initialize Editor
    codeEditor.value = DEFAULT_CODE;

    // Render Saved Snippets
    function renderSavedOptions() {
      savedSelect.innerHTML = '<option value="">Select saved program...</option>';
      snippets.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.title;
        savedSelect.appendChild(opt);
      });
      if (currentSnippetId) {
        savedSelect.value = currentSnippetId;
        deleteBtn.disabled = false;
      } else {
        deleteBtn.disabled = true;
      }
    }

    // Save Snippet
    saveBtn.addEventListener("click", () => {
      const title = prompt("Enter a title for this Python program:", currentSnippetId ? snippets.find(s => s.id === currentSnippetId)?.title : "My Script");
      if (!title) return;

      if (currentSnippetId) {
        const idx = snippets.findIndex(s => s.id === currentSnippetId);
        if (idx !== -1) {
          snippets[idx].title = title;
          snippets[idx].code = codeEditor.value;
          snippets[idx].updatedAt = new Date().toISOString();
        }
      } else {
        const newSnippet = {
          id: "snip_" + Date.now(),
          title: title,
          code: codeEditor.value,
          createdAt: new Date().toISOString()
        };
        snippets.push(newSnippet);
        currentSnippetId = newSnippet.id;
      }
      localStorage.setItem("standalone_compiler_snippets", JSON.stringify(snippets));
      saveStatus.textContent = "Saved: " + title;
      renderSavedOptions();
    });

    // Delete Snippet
    deleteBtn.addEventListener("click", () => {
      if (!currentSnippetId) return;
      if (!confirm("Are you sure you want to delete this program?")) return;
      snippets = snippets.filter(s => s.id !== currentSnippetId);
      localStorage.setItem("standalone_compiler_snippets", JSON.stringify(snippets));
      currentSnippetId = null;
      codeEditor.value = DEFAULT_CODE;
      saveStatus.textContent = "Unsaved snippet";
      renderSavedOptions();
    });

    // Load Snippet
    savedSelect.addEventListener("change", (e) => {
      const id = e.target.value;
      if (!id) {
        currentSnippetId = null;
        codeEditor.value = DEFAULT_CODE;
        saveStatus.textContent = "Unsaved snippet";
        deleteBtn.disabled = true;
        return;
      }
      const item = snippets.find(s => s.id === id);
      if (item) {
        currentSnippetId = item.id;
        codeEditor.value = item.code;
        saveStatus.textContent = "Loaded: " + item.title;
        deleteBtn.disabled = false;
      }
    });

    // Ensure Pyodide
    async function getPyodide() {
      if (pyodideInstance) return pyodideInstance;
      if (pyodideLoading) return;
      pyodideLoading = true;
      runtimeStatus.textContent = "Downloading Python WebAssembly runtime...";
      try {
        pyodideInstance = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/"
        });
        runtimeStatus.textContent = "Python runtime ready";
        return pyodideInstance;
      } catch (err) {
        runtimeStatus.textContent = "Error loading Pyodide";
        outputPanel.textContent = "Failed to load Python runtime: " + err.message;
        throw err;
      } finally {
        pyodideLoading = false;
      }
    }

    // Run Python Code
    async function executeCode() {
      const code = codeEditor.value;
      runBtn.disabled = true;
      runBtn.classList.add("opacity-50");
      runBtnText.textContent = "Executing...";
      runtimeStatus.textContent = "Running...";
      outputPanel.textContent = "";

      let buffer = "";
      function appendOutput(txt) {
        buffer += txt + "\\n";
        outputPanel.textContent = buffer;
      }

      try {
        const pyodide = await getPyodide();
        pyodide.setStdout({ batched: appendOutput });
        pyodide.setStderr({ batched: appendOutput });

        const startTime = performance.now();
        await pyodide.runPythonAsync(code);
        const duration = ((performance.now() - startTime) / 1000).toFixed(2);
        
        runtimeStatus.textContent = `Completed in ${duration}s`;
        if (!buffer.trim()) {
          outputPanel.textContent = "(Process finished with exit code 0 - no output)";
        }
      } catch (err) {
        runtimeStatus.textContent = "Execution failed";
        outputPanel.textContent = buffer + (buffer ? "\\n" : "") + err.message;
      } finally {
        runBtn.disabled = false;
        runBtn.classList.remove("opacity-50");
        runBtnText.textContent = "Run (Ctrl+Enter)";
      }
    }

    // Event Listeners
    runBtn.addEventListener("click", executeCode);
    clearBtn.addEventListener("click", () => {
      outputPanel.textContent = "";
      runtimeStatus.textContent = "Ready";
    });

    // Keyboard Shortcuts (Ctrl+Enter or Cmd+Enter)
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        executeCode();
      }
    });

    // Tab key support in textarea
    codeEditor.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = codeEditor.selectionStart;
        const end = codeEditor.selectionEnd;
        codeEditor.value = codeEditor.value.substring(0, start) + "    " + codeEditor.value.substring(end);
        codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
      }
    });

    // Initial render of saved snippets
    renderSavedOptions();
  </script>
</body>
</html>
